
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
      }

      .main {
        height: 100vh;
        background: #25384B;
        display: flex;
        padding: 10vh 0;
      }

      .left-section {
        background: #A3CFCC;
        flex: 1;
        margin-left: 3em;
        margin-right: 1em;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .right-section {
        background: #F7CFB6;
        width: 10em;
        margin-right: 3em;
        display: flex;
        flex-direction: column;
        gap: 1em;
        padding: 1em;
      }

      .item {
        background: #86C2DE;
        flex: 1;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <section class="left-section">
        <span style="font-size: 3em;"></span>
      </section>

      <section class="right-section">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
      </section>
    </div>
  </body>
</html>
